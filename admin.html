<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Comunitat NexSocial</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/logo.png">
  <link rel="stylesheet" href="/css/styles.css?v=31">

  <style>
    /* ── Escala del panell ───────────────────────────────────
       La web pública fa servir 20px de base perquè la llegeixin
       persones grans. El panell el fem servir nosaltres tres,
       així que aquí la tipografia va un 25% més petita i hi cap
       molta més informació a la pantalla. */
    .admin-body {
      --fs-xs:   12px;
      --fs-sm:   13px;
      --fs-base: 15px;
      --fs-md:   17px;
      --fs-lg:   20px;
      --fs-xl:   24px;
      --fs-2xl:  28px;
      --fs-3xl:  34px;
      font-size: var(--fs-base);
    }
    .admin-body h1 { font-size: var(--fs-2xl); margin-bottom: var(--sp-2); }
    .admin-body h2 { font-size: var(--fs-xl); }
    .admin-body h3 { font-size: var(--fs-md); }
    .admin-body .btn { padding: 8px 16px; font-size: var(--fs-sm); }
    .admin-body .btn-lg { padding: 10px 20px; font-size: var(--fs-base); }
    .admin-body .form-input,
    .admin-body .form-select,
    .admin-body .form-textarea { padding: 8px 10px; font-size: var(--fs-sm); }
    .admin-body .form-label { font-size: var(--fs-sm); margin-bottom: 2px; }
    .admin-body .form-group { margin-bottom: var(--sp-2); }
    .admin-body .form-help { font-size: var(--fs-xs); }
    .admin-body .filter-btn { padding: 6px 14px; font-size: var(--fs-sm); }
    .admin-body .admin-table th,
    .admin-body .admin-table td { padding: 8px 10px; font-size: var(--fs-sm); }
    .admin-body .section { padding: var(--sp-3); max-width: 1400px; }

    /* Pantalla de login del panel */
    .admin-login {
      max-width: 420px;
      margin: var(--sp-5) auto;
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: var(--sp-4);
      border: 1px solid rgba(15,45,30,0.10);
    }
    .admin-login h1 { margin-top: 0; }

    /* Graella d'activitats */
    .ev-capcalera {
      display:flex; justify-content:space-between; align-items:center;
      gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-3);
    }
    .ev-graella {
      display:grid; gap: var(--sp-3);
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    }
    .ev-card {
      display:flex; gap: var(--sp-3); background: var(--white);
      border:1px solid rgba(15,45,30,0.10); border-radius: var(--radius-lg);
      padding: var(--sp-3); align-items:flex-start;
    }
    .ev-card--passat { opacity:.72; border-style: dashed; }
    .ev-foto {
      width:110px; height:110px; object-fit:cover; flex:none;
      border-radius: var(--radius-sm); background: var(--forest-hero);
    }
    .ev-cos { flex:1; min-width:0; }
    .ev-dalt { display:flex; gap: var(--sp-1); align-items:center; flex-wrap:wrap; margin-bottom: var(--sp-1); }
    .ev-estat {
      color:#fff; font-size: var(--fs-xs); font-weight:600;
      padding: 2px 10px; border-radius: 999px;
    }
    .ev-avis { font-size: var(--fs-xs); color: var(--danger); font-weight:600; }
    .ev-titol { margin:0; font-size: var(--fs-md); }
    .ev-sub { margin:0 0 var(--sp-2); font-size: var(--fs-sm); color: var(--text-muted); }
    .ev-rapid {
      display:grid; grid-template-columns: repeat(auto-fit, minmax(95px, 1fr));
      gap: var(--sp-1); margin-bottom: var(--sp-2);
    }
    .ev-rapid label { display:block; font-size: var(--fs-xs); color: var(--text-muted); }
    .ev-rapid input, .ev-rapid select {
      width:100%; padding:6px 8px; font-size: var(--fs-sm);
      border:1px solid rgba(15,45,30,0.20); border-radius: var(--radius-sm);
      background: var(--white); color: var(--text);
    }
    .ev-places { display:flex; align-items:center; gap: var(--sp-2); margin-bottom: var(--sp-2); font-size: var(--fs-sm); }
    .ev-barra { flex:1; height:6px; background: var(--forest-hero); border-radius:999px; overflow:hidden; }
    .ev-barra span { display:block; height:100%; background: var(--forest); }
    .ev-places-avis {
      color:#fff; font-size: var(--fs-xs); font-weight:600;
      padding: 2px 10px; border-radius: 999px;
    }
    .ev-accions { display:flex; gap: var(--sp-1); flex-wrap:wrap; }
    .ev-accions .btn { padding:6px 12px; font-size: var(--fs-sm); }
    .ev-arxivar { color: var(--danger); border-color: var(--danger); }
    .ev-id { margin: var(--sp-2) 0 0; font-size: var(--fs-xs); color: var(--text-muted); }

    /* Editor d'inscripció (tarifes i extres) */
    .ins-ed { border:1px solid rgba(15,45,30,0.15); border-radius: var(--radius-lg);
              padding: var(--sp-3); margin-top: var(--sp-4); background: var(--white); }
    .ins-ed legend { font-weight:700; padding: 0 var(--sp-1); font-size: var(--fs-md); }
    .ins-ed h3 { margin: var(--sp-4) 0 var(--sp-1); }
    .ins-ed-grid { display:grid; gap: var(--sp-2); grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    .ins-ed-fila { border:1px solid rgba(15,45,30,0.10); border-radius: var(--radius);
                   padding: var(--sp-2); margin-bottom: var(--sp-2); background: var(--cream); }
    .ins-ed-cap { display:flex; align-items:center; gap: var(--sp-2); margin-bottom: var(--sp-2); }
    .ins-ed-cap code { font-size: var(--fs-xs); color: var(--text-muted); }
    .ins-ed-treure { margin-left:auto; color: var(--danger); }
    .ins-camp { display:flex; flex-direction:column; gap:2px; font-size: var(--fs-sm); }
    .ins-camp > span { font-weight:600; }
    .ins-camp small { color: var(--text-muted); font-size: var(--fs-xs); line-height:1.4; }
    .res-detall { max-width: 260px; }

    @media (max-width: 520px) {
      .ev-card { flex-direction: column; }
      .ev-foto { width:100%; height:140px; }
    }
  </style>
</head>
<body class="admin-body">
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <img src="/assets/logo.png" alt="NexSocial" class="nav-logo-img">
        <span class="nav-logo-tag">Admin</span>
      </a>
      <div class="nav-links">
        <a class="nav-link" href="/">← Web pública</a>
      </div>
    </div>
  </nav>

  <main id="main" class="section">
    <div id="admin-app"></div>
  </main>

  <script src="/js/main.js?v=35"></script>
  <script src="/js/carret.js?v=35"></script>
  <script src="/js/admin.js?v=35"></script>
</body>
</html>
