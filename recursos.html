<body>
  <div id="nav-placeholder"></div>
  <main id="main">
    <section class="section">
      <h1 data-i18n="recursos.title">Recursos i consells</h1>
      <p class="lead" data-i18n="recursos.sub">Guies senzilles per al dia a dia.</p>
      <div id="recursos-list" class="mt-4"></div>
    </section>

    <!-- Enllaç a Passatemps (ara pàgina pròpia) -->
    <section class="section">
      <a href="/passatemps.html" class="pastimes-promo">
        <div class="pastimes-promo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.4 7h-1.9a1.5 1.5 0 0 1-1.5-1.5V5a2 2 0 0 0-4 0v.5A1.5 1.5 0 0 1 10.5 7H8.6A1.6 1.6 0 0 0 7 8.6v1.9A1.5 1.5 0 0 0 8.5 12H9a2 2 0 0 1 0 4h-.5A1.5 1.5 0 0 0 7 17.5v1.9A1.6 1.6 0 0 0 8.6 21h1.9a1.5 1.5 0 0 0 1.5-1.5V19a2 2 0 0 1 4 0v.5a1.5 1.5 0 0 0 1.5 1.5h1.9a1.6 1.6 0 0 0 1.6-1.6v-1.9a1.5 1.5 0 0 0-1.5-1.5H19a2 2 0 0 1 0-4h.5A1.5 1.5 0 0 0 21 10.5V8.6A1.6 1.6 0 0 0 19.4 7z"/></svg></div>
        <div class="pastimes-promo-text">
          <h2 data-i18n="recursos.pas">Passatemps</h2>
          <p data-i18n="recursos.pas.promo">Jocs per activar la ment, fets a mida. Troba l'intrús, refranys, sopa de lletres i molt més.</p>
          <span class="pastimes-promo-cta" data-i18n="recursos.pas.cta">Anar als passatemps →</span>
        </div>
      </a>
    </section>
  </main>
  <div id="footer-placeholder"></div>

  <script src="/js/main.js?v=28"></script>
  <script src="/js/data.js?v=28"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = window.NX.T(el.dataset.i18n);
      });

      const CAT_LABEL = {
        ca: { salut: 'Salut', tramits: 'Tràmits', tecnologia: 'Tecnologia', 'vida-comunitaria': 'Vida comunitària', seguretat: 'Seguretat' },
        es: { salut: 'Salud', tramits: 'Trámites', tecnologia: 'Tecnología', 'vida-comunitaria': 'Vida comunitaria', seguretat: 'Seguridad' }
      };
      const cta = { ca: { veure: 'Veure vídeo →', llegir: 'Llegir guia →', ajuda: "Necessites ajuda? Truca'ns:" },
                    es: { veure: 'Ver vídeo →', llegir: 'Leer guía →', ajuda: '¿Necesitas ayuda? Llámanos:' } };
      const lang = window.NX.getLang();

      const html = (window.RECURSOS_DATA || []).map(r => {
        const iconMap = { salut: '❤️', tramits: '📋', tecnologia: '📱', 'vida-comunitaria': '👥', seguretat: '🛡️' };
        const cataLabel = CAT_LABEL[lang]?.[r.categoria] || r.categoria;
        return `
        <div class="resource-card">
          <span class="resource-tag">${iconMap[r.categoria] || '💡'} ${window.NX.esc(cataLabel)}</span>
          <h3 style="margin: 0;">${window.NX.esc(window.NX.L(r.titol))}</h3>
          <p>${window.NX.esc(window.NX.L(r.descripcio))}</p>
          <a href="${window.NX.esc(r.enllaç)}" class="btn btn-primary" target="_blank" rel="noopener">
            ${r.tipus === 'video' ? cta[lang].veure : cta[lang].llegir}
          </a>
          <div class="muted" style="font-size: var(--fs-sm); margin-top: 8px;">
            ${cta[lang].ajuda} <a href="tel:${window.NX.PHONE_TEL}"><strong>${window.NX.PHONE}</strong></a>
          </div>
        </div>`;
      }).join('');

      document.getElementById('recursos-list').innerHTML =
        `<div class="events-grid">${html}</div>` + window.NX.phoneBannerHTML();
    });
  </script>

</html>
