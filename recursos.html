  <style>
    /* Recursos — estils propis de la pàgina */
    .recursos-filtres { margin: var(--sp-4) 0 var(--sp-3); }
    .recursos-filtres-title {
      font-size: var(--fs-md);
      margin: 0 0 var(--sp-2);
    }
    .filter-btn--gran { font-size: var(--fs-base); padding: 14px 24px; }
    .recursos-estat {
      display: flex; align-items: center; gap: var(--sp-2);
      flex-wrap: wrap; margin-top: calc(var(--sp-2) * -1);
    }
    .resource-card--destacat {
      border-left-color: var(--green-mid);
      background: var(--cards-odd);
    }
    .resource-title { margin: 0; font-size: var(--fs-lg); }
    .resource-desc  { margin: 0; }
    .resource-font {
      margin: 0; font-size: var(--fs-xs); color: var(--text-muted);
      border-top: 1px solid rgba(15,45,30,0.10); padding-top: var(--sp-2);
    }
    .resource-cta { margin-top: auto; text-align: center; }
    .resource-domini {
      font-size: var(--fs-xs); color: var(--text-muted);
      text-align: center; word-break: break-all;
    }
    .recursos-ajuda {
      margin-top: var(--sp-5);
      background: var(--forest-hero);
      border-radius: var(--radius-lg);
      padding: var(--sp-4);
    }
    .recursos-ajuda h2 { margin-top: 0; }
    /* Guies NexSocial: material propi en PDF, destacat */
    .guies { margin: var(--sp-4) 0 var(--sp-5); }
    .guies-titol { font-size: var(--fs-xl); margin: 0 0 4px; }
    .guies-desc { margin: 0 0 var(--sp-3); color: var(--text-muted); }
    .guia {
      display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
      background: var(--white); border-radius: var(--radius-lg); overflow: hidden;
      box-shadow: 0 1px 2px rgba(15,45,30,0.06), 0 8px 24px rgba(15,45,30,0.08);
      border: 1px solid rgba(15,45,30,0.08);
    }
    .guia + .guia { margin-top: var(--sp-3); }
    .guia-portada { display: flex; align-items: center; background: var(--cream); }
    .guia-portada picture { width: 100%; }
    .guia-portada img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; }
    .guia-cos { padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-1); }
    .guia-etiqueta {
      align-self: flex-start; background: var(--forest); color: #fff; font-weight: 700;
      font-size: var(--fs-xs); letter-spacing: .06em; text-transform: uppercase;
      padding: 4px 12px; border-radius: 999px;
    }
    .guia-titol { margin: var(--sp-1) 0 0; font-size: var(--fs-xl); line-height: 1.1; }
    .guia-subtitol { margin: 0; font-size: var(--fs-md); }
    .guia-punts { margin: var(--sp-1) 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
    .guia-punts li { padding-left: 28px; position: relative; }
    .guia-punts li::before {
      content: '✓'; position: absolute; left: 0; top: 0; width: 20px; height: 20px; border-radius: 50%;
      background: var(--forest-hero); color: var(--forest); font-weight: 700; font-size: 13px;
      display: grid; place-items: center;
    }
    .guia-meta { margin: var(--sp-1) 0 0; font-size: var(--fs-sm); color: var(--text-muted); }
    .guia-botons { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: auto; padding-top: var(--sp-2); }
    .guia-botons .btn { flex: 1 1 auto; text-align: center; }
    @media (max-width: 820px) {
      .guia { grid-template-columns: 1fr; }
      .guia-cos { padding: var(--sp-3); }
    }
    .recursos-ajuda-tel { font-size: var(--fs-md); }
  </style>
</head>

    </section>

    <!-- Enllaç a Passatemps (ara pàgina pròpia) -->

      <a href="/passatemps.html" class="pastimes-promo">

        <div class="pastimes-promo-text">
          <h2 data-i18n="recursos.pas">Passatemps</h2>
          <p data-i18n="recursos.pas.promo">Jocs per activar la ment, fets a mida. Troba l'intrús, refranys, sopa de lletres i molt més.</p>
          <span class="pastimes-promo-cta" data-i18n="recursos.pas.cta">Anar als passatemps →</span>
        </div>
      </a>
    </section>
