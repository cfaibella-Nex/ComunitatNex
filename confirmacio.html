<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva confirmada · Comunitat NexSocial</title>
  <link rel="icon" href="/assets/logo.png">
  <link rel="stylesheet" href="/css/styles.css?v=40">
</head>
<body>
  <div id="nav-placeholder"></div>
  <main id="main">
    <section class="section" style="text-align: center; max-width: 640px;">
      <div id="conf-icona" style="font-size: 96px; margin-bottom: var(--sp-3);" aria-hidden="true">✅</div>
      <h1 data-i18n="conf.title">Reserva confirmada!</h1>
      <p class="lead" data-i18n="conf.desc">T'hem apuntat.</p>

      <div class="alert alert-success mt-3" id="ref-box">
        <span data-i18n="conf.ref">Número de reserva:</span>
        <strong id="ref-value" style="font-size: var(--fs-lg); letter-spacing: 0.05em;"></strong>
      </div>

      <a href="/agenda.html" class="btn btn-primary btn-lg mt-4" data-i18n="conf.back">
        Tornar a l'agenda
      </a>
    </section>
  </main>
  <div id="footer-placeholder"></div>

  <script src="/js/main.js?v=40"></script>
  <script src="/js/carret.js?v=37"></script>
  <script>
    /* Tres casos:
       · reserva normal            → ✅ com sempre
       · ?pagament=ok  (de Stripe) → es consulta l'estat fins que arriba l'avís
       · ?pagament=ko  (de Stripe) → no s'ha cobrat res
       El que diu si està pagat és el webhook, no la URL: per això es
       pregunta al servidor en lloc de fiar-se del paràmetre. */
    document.addEventListener('DOMContentLoaded', () => {
      const NXC = window.NXC;
      document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = window.NX.T(el.dataset.i18n));
      const p = new URLSearchParams(location.search);
      const ref = p.get('ref') || 'OK';
      const pag = p.get('pagament');
      document.getElementById('ref-value').textContent = ref;

      const icona = document.getElementById('conf-icona');
      const titol = document.querySelector('[data-i18n="conf.title"]');
      const desc  = document.querySelector('[data-i18n="conf.desc"]');
      const box   = document.getElementById('ref-box');

      if (pag === 'presencial') {
        desc.textContent = desc.textContent + ' ' + NXC.t('conf.presencial');
        return;
      }
      if (pag === 'ko') {
        icona.textContent = '↩️';
        titol.textContent = NXC.t('conf.ko_titol');
        desc.textContent = NXC.t('conf.ko');
        box.className = 'alert alert-warning mt-3';
        return;
      }
      if (pag !== 'ok') { NXC.clearCart(); return; }

      NXC.clearCart();
      icona.textContent = '⏳';
      titol.textContent = NXC.t('conf.processant');
      desc.textContent = '';
      let intents = 0;
      (async function consulta() {
        intents++;
        try {
          const r = await fetch('/api/reserva?ref=' + encodeURIComponent(ref), { cache: 'no-store' });
          const d = r.ok ? await r.json() : null;
          if (d && d.payment_status === 'paid') {
            icona.textContent = '✅';
            titol.textContent = NXC.t('conf.pagat_titol');
            desc.textContent = NXC.t('conf.pagat');
            return;
          }
          if (d && d.payment_status === 'failed') {
            icona.textContent = '↩️';
            titol.textContent = NXC.t('conf.ko_titol');
            desc.textContent = NXC.t('conf.ko');
            box.className = 'alert alert-warning mt-3';
            return;
          }
        } catch (e) { /* es torna a provar */ }
        if (intents < 8) return setTimeout(consulta, 2000);
        icona.textContent = '✅';
        titol.textContent = window.NX.T('conf.title');
        desc.textContent = NXC.t('conf.pendent');
      })();
    });
  </script>
</body>
</html>
